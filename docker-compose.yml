services:
  db:
    image: postgres:16
    container_name: team03pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: team03db
      POSTGRES_USER: team03user
      POSTGRES_PASSWORD: supersecret
    ports:
      - "5432:5432"
    volumes:
      - team03_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team03user -d team03db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  team03_data:
